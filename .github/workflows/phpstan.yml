name: PHPStan

on:
  push:
    paths:
      - '**.php'
      - 'phpstan.neon.dist'
      - '.github/workflows/phpstan.yml'

jobs:
  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Checkout core package
        uses: actions/checkout@v6
        with:
          repository: kongpda/laravel-attachments-core
          path: packages/laravel-attachments-core

      - name: Link sibling core package
        run: ln -s "$GITHUB_WORKSPACE/packages/laravel-attachments-core" "$GITHUB_WORKSPACE/../laravel-attachments-core"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Run PHPStan
        run: ./vendor/bin/phpstan --error-format=github
